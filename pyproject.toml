[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "docs/archive",
  "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "B018",
]
# TEMPORARY: pyupgrade (UP) is deferred for modules being changed concurrently
# on another branch. Remove these entries once that work lands.
"core/archive_processor.py" = ["UP"]
"core/file_handler.py" = ["UP"]
"core/run_report.py" = ["UP"]
"core/safety_invariants.py" = ["UP"]
"core/unattended.py" = ["UP"]
"unpackr.py" = ["UP"]
"utils/cli_runtime.py" = ["UP"]

[tool.mypy]
python_version = "3.12"
files = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
strict = true
show_error_codes = true
pretty = true

[tool.pyright]
pythonVersion = "3.12"
# Strict for every module except the temporarily relaxed ones (unpackr.py,
# core/archive_processor.py, core/run_report.py, core/unattended.py,
# utils/cli_runtime.py), which are being changed on another branch. Once they
# are typed, switch to typeCheckingMode = "strict" and drop the explicit list.
typeCheckingMode = "standard"
# TEMPORARY: unpackr.py has a possibly-unbound `runtime_app` in its
# KeyboardInterrupt handler (Ctrl+C during app init); it is being changed on
# another branch, so the finding is reported as a warning until then.
executionEnvironments = [
  { root = "unpackr.py", extraPaths = ["."], reportPossiblyUnboundVariable = "warning" },
  { root = "." },
]
include = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude = [
  "**/__pycache__",
  "archive",
  "docs/archive",
]
strict = [
  "core/__init__.py",
  "core/adaptive_policy.py",
  "core/config.py",
  "core/file_handler.py",
  "core/junk_rules.py",
  "core/logger.py",
  "core/naming.py",
  "core/remover.py",
  "core/safety_invariants.py",
  "core/structured_events.py",
  "core/video_processor.py",
  "utils/__init__.py",
  "utils/cli_prompts.py",
  "utils/cli_render.py",
  "utils/cli_subcommands.py",
  "utils/defensive.py",
  "utils/dry_run_summary.py",
  "utils/error_messages.py",
  "utils/filesystem_policy.py",
  "utils/platform_support.py",
  "utils/progress.py",
  "utils/run_state.py",
  "utils/run_summary.py",
  "utils/safety.py",
  "utils/service.py",
  "utils/system_check.py",
  "utils/trash.py",
  "doctor.py",
  "vhealth.py",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]

[tool.bandit]
targets = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude_dirs = [
  "tests",
  "docs",
  "archive",
]
skips = [
  "B404",
  "B603",
  "B607",
]

[[tool.mypy.overrides]]
# TEMPORARY: modules being changed concurrently on another branch. They keep
# the pre-strict rules (fully annotated defs were already required for these)
# and only skip what `strict` adds. Remove once that work lands.
module = [
  "core.archive_processor",
  "core.file_handler",
  "core.safety_invariants",
]
disallow_any_generics = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# TEMPORARY: modules being changed concurrently on another branch that were
# never required to be annotated. Remove once that work lands.
module = [
  "core.run_report",
  "core.unattended",
  "unpackr",
  "utils.cli_runtime",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
