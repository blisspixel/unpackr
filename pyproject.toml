[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "docs/archive",
  "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "SIM",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "B018",
]

[tool.mypy]
python_version = "3.11"
files = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
check_untyped_defs = true
strict_equality = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude = [
  "**/__pycache__",
  "archive",
  "docs/archive",
]
strict = [
  "core/config.py",
  "core/file_handler.py",
  "core/safety_invariants.py",
]
venvPath = "."
reportMissingImports = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]

[tool.bandit]
targets = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude_dirs = [
  "tests",
  "docs",
  "archive",
]
skips = [
  "B404",
  "B603",
  "B607",
]

[[tool.mypy.overrides]]
module = [
  "core.archive_processor",
  "core.file_handler",
  "core.safety_invariants",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
