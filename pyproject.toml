[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unpackr"
dynamic = ["version"]
description = "Turn messy folders of archives into clean, working videos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache 2.0 with Commons Clause" }
dependencies = [
  "colorama>=0.4.4",
  "psutil>=5.8.0",
  "tqdm>=4.62.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: Other/Proprietary License",
]

[project.urls]
Homepage = "https://github.com/blisspixel/unpackr"
Issues = "https://github.com/blisspixel/unpackr/issues"
Source = "https://github.com/blisspixel/unpackr"

[project.optional-dependencies]
dev = [
  "bandit>=1.7.8",
  "mypy>=2.4",
  "pre-commit>=4.0",
  "pyright>=1.1.414",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.17",
  "setuptools>=68",
  "types-colorama>=0.4.15",
  "types-psutil>=7.2",
  "types-tqdm>=4.70",
]

[project.scripts]
unpackr = "unpackr.cli:main"
unpackr-doctor = "unpackr.doctor:main"
vhealth = "unpackr.vhealth:main"

[tool.setuptools.dynamic]
version = { attr = "unpackr.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unpackr.config_files" = ["config.json", "comments.sample.json"]

[tool.setuptools.exclude-package-data]
"unpackr.config_files" = ["comments.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "docs/archive",
  "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "B018",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = [
  "src/unpackr",
]
strict = true
show_error_codes = true
pretty = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = [
  "src",
]
include = [
  "src/unpackr",
]
exclude = [
  "**/__pycache__",
  "archive",
  "docs/archive",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]
pythonpath = [
  "src",
]

[tool.bandit]
targets = [
  "src/unpackr",
]
exclude_dirs = [
  "tests",
  "docs",
  "archive",
]
skips = [
  "B404",
  "B603",
  "B607",
]
