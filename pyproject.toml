[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "docs/archive",
  "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "B018",
]

[tool.mypy]
python_version = "3.12"
files = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
strict = true
show_error_codes = true
pretty = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude = [
  "**/__pycache__",
  "archive",
  "docs/archive",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]

[tool.bandit]
targets = [
  "core",
  "utils",
  "doctor.py",
  "unpackr.py",
  "vhealth.py",
]
exclude_dirs = [
  "tests",
  "docs",
  "archive",
]
skips = [
  "B404",
  "B603",
  "B607",
]
