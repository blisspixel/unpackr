name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: CLI entry point smoke test
        run: |
          unpackr --help
          unpackr-doctor --help
          vhealth --help

      - name: Wheel contents smoke test
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import glob, zipfile; wheel = glob.glob('dist/unpackr-*.whl')[0]; names = set(zipfile.ZipFile(wheel).namelist()); required = {'unpackr.py', 'doctor.py', 'vhealth.py', 'config_files/config.json', 'config_files/comments.sample.json'}; assert required <= names, required - names; assert 'config_files/comments.json' not in names"

      - name: Pre-commit quality gate
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m pre_commit run --all-files --show-diff-on-failure

      - name: Pytest (Windows Full Suite + Coverage Gate)
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        run: python -m pytest -q --cov --cov-fail-under=80 --cov-report=term-missing

      - name: Pytest (Windows Full Suite)
        if: runner.os == 'Windows' && matrix.python-version != '3.11'
        run: python -m pytest -q

      - name: Pytest (Linux/macOS Smoke)
        if: runner.os != 'Windows'
        run: python -m pytest -q tests/test_cli_render.py tests/test_runtime_helpers.py
